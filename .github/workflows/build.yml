name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip ac
        run: unzip -q PhysicsLauncher.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Lisanslari kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Derle
        working-directory: PhysicsLauncher
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Release olustur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" PhysicsLauncher/app/build/outputs/apk/debug/app-debug.apk --repo ${{ github.repository }} --title "Fizik Launcher #${{ github.run_number }}" --notes "Debug APK"
